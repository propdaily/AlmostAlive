<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini FPS Prototype</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
    #instructions {
      position: absolute; top: 50%; width: 100%; text-align: center;
      font-size: 24px; color: white; font-family: sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="instructions">Click to play</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.156.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.156.0/examples/js/controls/PointerLockControls.js"></script>
  <script>
    // Scene, camera, renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x20232a);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(1, 2, 3);
    scene.add(light);

    // Floor
    const floorGeometry = new THREE.PlaneGeometry(50, 50);
    const floorMaterial = new THREE.MeshStandardMaterial({color: 0x808080});
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI/2;
    scene.add(floor);

    // Simple walls
    const wallGeometry = new THREE.BoxGeometry(50, 10, 1);
    const wallMaterial = new THREE.MeshStandardMaterial({color:0x333333});
    const backWall = new THREE.Mesh(wallGeometry, wallMaterial);
    backWall.position.set(0,5,-25);
    scene.add(backWall);

    const frontWall = new THREE.Mesh(wallGeometry, wallMaterial);
    frontWall.position.set(0,5,25);
    scene.add(frontWall);

    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(1,10,50), wallMaterial);
    leftWall.position.set(-25,5,0);
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(1,10,50), wallMaterial);
    rightWall.position.set(25,5,0);
    scene.add(rightWall);

    // Player controls
    const controls = new THREE.PointerLockControls(camera, document.body);
    const instructions = document.getElementById('instructions');
    instructions.addEventListener('click', () => controls.lock());

    controls.addEventListener('lock', () => instructions.style.display = 'none');
    controls.addEventListener('unlock', () => instructions.style.display = '');

    scene.add(controls.getObject());

    // Movement
    const move = {forward:false, backward:false, left:false, right:false};
    const velocity = new THREE.Vector3();
    const speed = 0.2;

    document.addEventListener('keydown', e => {
      if(e.code === 'KeyW') move.forward = true;
      if(e.code === 'KeyS') move.backward = true;
      if(e.code === 'KeyA') move.left = true;
      if(e.code === 'KeyD') move.right = true;
    });
    document.addEventListener('keyup', e => {
      if(e.code === 'KeyW') move.forward = false;
      if(e.code === 'KeyS') move.backward = false;
      if(e.code === 'KeyA') move.left = false;
      if(e.code === 'KeyD') move.right = false;
    });

    // Shooting
    const bullets = [];
    document.addEventListener('click', () => {
      const bulletGeometry = new THREE.SphereGeometry(0.1, 8, 8);
      const bulletMaterial = new THREE.MeshBasicMaterial({color:0xff0000});
      const bullet = new THREE.Mesh(bulletGeometry, bulletMaterial);
      bullet.position.copy(camera.position);
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      bullet.userData.velocity = forward.multiplyScalar(1);
      scene.add(bullet);
      bullets.push(bullet);
    });

    // Animate
    function animate() {
      requestAnimationFrame(animate);

      // Movement
      velocity.set(0,0,0);
      if(move.forward) velocity.z -= speed;
      if(move.backward) velocity.z += speed;
      if(move.left) velocity.x -= speed;
      if(move.right) velocity.x += speed;

      controls.moveRight(velocity.x);
      controls.moveForward(velocity.z);

      // Update bullets
      for(let i=bullets.length-1; i>=0; i--){
        const b = bullets[i];
        b.position.add(b.userData.velocity);
        if(b.position.length() > 100){
          scene.remove(b);
          bullets.splice(i,1);
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
